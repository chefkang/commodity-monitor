<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大宗商品价格日报</title>
    <link rel="icon" href="./assets/maxcellent-favicon.png" />
    <link rel="stylesheet" href="./report.css" />
  </head>
  <body>
    <main class="report">
      <header class="hero">
        <div>
          <div class="hero-brand">
            <img src="./assets/maxcellent-logo-wordmark.png" alt="MAXCELLENT 迈瑟伦" />
            <span>迈瑟伦原材料日报</span>
          </div>
          <h1>迈瑟伦原材料价格日报</h1>
          <p id="reportDate" class="subline">正在读取今日价格与趋势</p>
        </div>
        <div class="hero-score">
          <span>采购成本压力</span>
          <strong id="score">--</strong>
          <small id="scoreText">--</small>
        </div>
      </header>

      <section class="summary-grid">
        <article>
          <span>监测品种</span>
          <strong id="tracked">--</strong>
          <small>覆盖电池、线材、PCB、塑料、纸箱</small>
        </article>
        <article>
          <span>今日上涨</span>
          <strong id="rising">--</strong>
          <small>按上一有效价格比较</small>
        </article>
        <article>
          <span>高风险</span>
          <strong id="highRisk">--</strong>
          <small>涨价概率达到预警线</small>
        </article>
        <article>
          <span>新闻扰动</span>
          <strong id="newsRisk">--</strong>
          <small>国际与产业供应链信号</small>
        </article>
      </section>

      <section class="report-grid">
        <section class="panel narrative">
          <div class="panel-title">
            <p class="kicker">今日汇报</p>
            <h2>今日汇报</h2>
          </div>
          <div id="briefCards" class="brief-cards"></div>
        </section>

        <section class="panel action-panel">
          <div class="panel-title">
            <p class="kicker">采购动作</p>
            <h2>采购建议</h2>
          </div>
          <ol id="actions"></ol>
        </section>
      </section>

      <section class="panel component-panel">
        <div class="panel-title">
          <p class="kicker">成本大类</p>
          <h2>产品成本大类评估</h2>
        </div>
        <div id="componentGrid" class="component-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-title row">
          <div>
            <p class="kicker">价格明细</p>
            <h2>原材料价格可视化表</h2>
          </div>
          <a href="./index.html">进入趋势看板</a>
        </div>
        <div class="visual-table" id="visualTable"></div>
      </section>

      <section class="lower-grid">
        <section class="panel">
          <div class="panel-title">
            <p class="kicker">综合趋势</p>
            <h2>综合成本趋势</h2>
          </div>
          <svg id="indexChart" viewBox="0 0 920 260" role="img" aria-label="综合成本趋势"></svg>
        </section>
        <section class="panel">
          <div class="panel-title">
            <p class="kicker">新闻扰动</p>
            <h2>影响价格的新闻</h2>
          </div>
          <div class="news-list" id="newsList"></div>
        </section>
      </section>

      <footer class="report-footer">
        <img src="./assets/maxcellent-logo-wordmark.png" alt="MAXCELLENT 迈瑟伦" />
        <span>MAXCELLENT 迈瑟伦 · 大宗商品价格日报</span>
      </footer>
    </main>

    <script src="./data.js"></script>
    <script src="./report.js"></script>
  </body>
</html>
