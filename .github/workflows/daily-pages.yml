name: Daily Commodity Monitor

on:
  workflow_dispatch:
  schedule:
    # 10:00 and 15:00 Asia/Shanghai every day, including weekends and holidays
    - cron: "0 2,7 * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      skip_reason: ${{ steps.guard.outputs.skip_reason }}
    steps:
      - name: Check duplicate scheduled run
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: daily-pages.yml
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          output_path = os.environ["GITHUB_OUTPUT"]

          def set_output(name, value):
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          if os.environ["EVENT_NAME"] != "schedule":
              set_output("should_run", "true")
              set_output("skip_reason", "")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          run_id = int(os.environ["RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          workflow_file = os.environ["WORKFLOW_FILE"]

          now_utc = dt.datetime.now(dt.timezone.utc)
          bj_tz = dt.timezone(dt.timedelta(hours=8))
          now_bj = now_utc.astimezone(bj_tz)
          slot_hour = 10 if now_bj.hour < 13 else 15
          slot_bj = now_bj.replace(hour=slot_hour, minute=0, second=0, microsecond=0)
          slot_utc = slot_bj.astimezone(dt.timezone.utc)

          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_file}/runs?branch=main&per_page=30"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              payload = json.load(resp)

          for run in payload.get("workflow_runs", []):
              if int(run["id"]) == run_id:
                  continue
              if run.get("event") not in {"schedule", "workflow_dispatch"}:
                  continue
              created = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created < slot_utc:
                  continue
              status = run.get("status")
              conclusion = run.get("conclusion")
              if status != "completed" or conclusion == "success":
                  set_output("should_run", "false")
                  reason = f"同一档已有运行记录：{run['id']} {run['html_url']}"
                  set_output("skip_reason", reason)
                  print(reason)
                  raise SystemExit(0)

          set_output("should_run", "true")
          set_output("skip_reason", "")
          PY

  build:
    needs: check
    if: ${{ needs.check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh commodity data
        run: python -u scripts/commodity_monitor.py --backfill-days 180

      - name: Build public site
        run: python scripts/build_public_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [check, build]
    if: ${{ needs.check.outputs.should_run == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [check, build, deploy]
    if: ${{ always() && needs.check.outputs.should_run != 'false' }}
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || 465 }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}
      MAIL_TO: 1977513586@qq.com
    steps:
      - name: Compose notification
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            status="失败"
            summary="本次自动更新前置检查失败，请进入 GitHub Actions 查看日志。"
          elif [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            status="成功"
            summary="本次数据刷新和网页发布均已完成。"
          else
            status="失败"
            summary="本次自动更新未完全成功，请进入 GitHub Actions 查看日志。"
          fi
          echo "MAIL_SUBJECT=迈瑟伦原材料监测更新${status} - $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          {
            echo "MAIL_BODY<<EOF"
            echo "迈瑟伦原材料价格监测自动更新状态：${status}"
            echo ""
            echo "${summary}"
            echo ""
            echo "运行时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo "数据构建：${{ needs.build.result }}"
            echo "网页发布：${{ needs.deploy.result }}"
            echo "日报首页：https://chefkang.github.io/commodity-monitor/"
            echo "趋势看板：https://chefkang.github.io/commodity-monitor/trend.html"
            echo "运行日志：https://github.com/chefkang/commodity-monitor/actions/runs/${{ github.run_id }}"
            echo ""
            echo "说明：价格来自公开行情源或明确标注的代理指标；涨价概率为采购风险预警模型，不作为市场事实。"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send email notification
        if: ${{ env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = os.environ["MAIL_SUBJECT"]
          msg["From"] = os.environ["MAIL_FROM"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(os.environ["MAIL_BODY"])

          server = os.environ["SMTP_SERVER"]
          port = int(os.environ.get("SMTP_PORT") or "465")
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL(server, port, context=context, timeout=30) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          print("Email notification sent.")
          PY

      - name: Email not configured
        if: ${{ env.SMTP_SERVER == '' || env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' }}
        run: |
          echo "邮件通知未发送：请在仓库 Secrets 配置 SMTP_SERVER、SMTP_PORT、SMTP_USERNAME、SMTP_PASSWORD、MAIL_FROM。"
