<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机查看大宗商品价格日报</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      background: #f5f1e9;
      color: #171513;
    }
    main {
      max-width: 860px;
      margin: 40px auto;
      padding: 28px;
    }
    .card {
      background: #fffdf8;
      border: 1px solid #ded5c8;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(36, 29, 18, .08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 48px);
    }
    p {
      color: #6b6359;
      line-height: 1.7;
    }
    .url {
      margin: 22px 0;
      padding: 18px;
      background: #25211c;
      color: #fff;
      border-radius: 8px;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 800;
      word-break: break-all;
    }
    a.button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 10px 16px;
      background: #087c7a;
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 800;
    }
    ol {
      line-height: 1.8;
      padding-left: 22px;
    }
    .note {
      margin-top: 18px;
      padding: 14px;
      background: #f9f6ef;
      border: 1px solid #ded5c8;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>手机查看大宗商品价格日报</h1>
      <p>电脑已开启局域网访问。手机和电脑连接同一个 Wi-Fi 后，用手机浏览器输入下面地址即可查看。</p>
      <div class="url">__MOBILE_URL__</div>
      <p>这个地址已复制到电脑剪贴板。</p>
      <a class="button" href="__LOCAL_PREVIEW__" target="_blank">在电脑上预览日报</a>
      <div class="note">
        <strong>手机打不开时：</strong>
        <ol>
          <li>确认手机和电脑连的是同一个 Wi-Fi，不要只用手机流量。</li>
          <li>如果 Windows 弹出防火墙提示，请允许 Python/专用网络访问。</li>
          <li>电脑休眠或关机后，手机端访问会中断，需要重新点桌面入口。</li>
        </ol>
      </div>
    </section>
  </main>
</body>
</html>
